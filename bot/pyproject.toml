[project]
name = "orb-bot"
version = "0.1.0"
description = "Opening Range Breakout bot for Alpaca paper trading"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.30",
    "pydantic-settings>=2.4",
]

[project.scripts]
orb-bot = "orb_bot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orb_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
